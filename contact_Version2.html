<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Контакты — Многостраничный сайт</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Контакты</h1>
    <nav class="main-nav" aria-label="Навигация">
      <a href="index.html" class="nav-link">Главная</a>
      <a href="about.html" class="nav-link">О нас</a>
      <a href="projects.html" class="nav-link">Проекты</a>
      <a href="contact.html" class="nav-link">Контакты</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Связаться с нами</h2>
      <p>Электронная почта: <a href="mailto:info@example.com">info@example.com</a></p>

      <h3>Быстрая форма (работает на клиенте)</h3>
      <form id="contactForm" action="#" onsubmit="return onSubmitForm(event)">
        <label>
          Имя:<br>
          <input type="text" name="name" required>
        </label>
        <br>
        <label>
          Сообщение:<br>
          <textarea name="message" rows="4" required></textarea>
        </label>
        <br>
        <button type="submit">Отправить</button>
      </form>

      <div id="formResult" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p><a href="index.html">← Вернуться на главную</a></p>
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
